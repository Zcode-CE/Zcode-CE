# ZCode-CE 发布构建流水线
#
# 触发：
#   - push tag `v*`（如 v3.14.1-ce.1）→ 构建 + 发布到 GitHub Release
#   - workflow_dispatch               → 构建 + 上传 artifact（默认不新建 Release，见下）
#
# 为什么必须走 CI：Windows 安装包（nsis）无法在 Linux 上交叉打包，必须由 windows-latest 产出。
#
# 说明文档：docs/operations/ci.md、docs/operations/release.md
# 本文件已在真实 GitHub runner 上验证并持续运行（CI / Release 两个 workflow 均为 active）。
# 注意：不要在此处写死运行次数或版本号 —— 这类值会漂移；需要引用时用 `gh run list` 现取。
# 首次验证记录与已知问题：.reverse/21-release/R3b-ci.md

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# electron-builder 需要写权限把产物发到 Release；使用自带 GITHUB_TOKEN，无需 PAT。
permissions:
  contents: write

# 同一 tag 重复触发时串行化，避免两次运行同时向同一个 Release 上传产物。
# 不用 cancel-in-progress：打包耗时约 20 分钟，中途取消会留下不完整 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前置校验。
  #
  # 为什么必须有：本流水线自己**不跑任何测试**（Checkout → Install → bundle → Upload），
  # 所以没有这道 job 时，tag 可以指向一个从未被任何流水线验证过的提交 ——
  # 3.14.1-ce.1.fix.2 就是这么发布的（CI 挂在 Test 步，而 tag 已经存在、构建已经在跑）。
  # 有了它，「先推代码 → CI 绿 → 再单独打 tag」就从纪律变成了机械约束。
  #
  # ⚠️ 步骤与 .github/workflows/ci.yml 的 verify 必须保持一致，改一处要同步另一处。
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # architecture:check --changed 需要基线对比，浅克隆会让变更集判断失真。
          fetch-depth: 0

      # 不传 version：读取根 package.json 的 "packageManager": "pnpm@10.33.2"。
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Test
        run: pnpm test

      - name: Architecture check
        run: pnpm run architecture:check -- --changed

  build:
    name: build ${{ matrix.artifact }}
    # 校验不过就不产出任何安装包，避免再次出现「tag 已存在、构建已开始」的坏发布。
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不应阻止另一个平台产出（Windows 包只能在这里产出，尤其不能被 Linux 失败连坐）。
      fail-fast: false
      # ⚠️ 必须串行：本流水线依赖 electron-builder 的 GitHub publisher 上传产物，
      # 而它在两个平台并行时会各自尝试创建同一个 tag 的 Release。electron-publish 的
      # getOrCreateRelease() 是「先列 Release 再 POST 创建」，创建失败没有重试
      # （只有资产上传失败才重试），并发创建会以 422 already_exists 直接让整个构建失败。
      # 代价是总时长约为两平台之和（约 40 分钟）而非取最大值；发布频率低，换取可靠性。
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux
          - os: windows-latest
            platform: win
            arch: x64
            artifact: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 不传 version：pnpm/action-setup 会读取根 package.json 的
      # "packageManager": "pnpm@10.33.2"。同时传 version 会因版本冲突直接报错。
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm

      # rpm target 需要 rpmbuild，缺失时 electron-builder 在 rpm 阶段报
      # "Need executable 'rpmbuild' to convert dir to rpm"。
      # libarchive-tools 提供 bsdtar，pacman target 依赖它（本机已自带，CI 镜像不保证有）。
      - name: Install packaging tools (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ 只调用一次 bundle:desktop：scripts/bundle.mjs 内部已经依次执行
      # prepare:runtime-assets → build → electron-builder → 产物校验 → 体积审计。
      # 不要在它之前再单独跑一次 prepare/build，那会把约 10 分钟的资产准备重复做一遍。
      #
      # ⚠️ bundle:desktop 的脚本定义是 "pnpm --filter @zcode/desktop run bundle --"（末尾已有 --）。
      # 调用时不要再补一个 --，否则参数会被当成位置参数丢掉，bundle.mjs 回退到默认目标
      - name: Build installers
        env:
          ZCODE_ENV: production
          # electron-builder 的 GitHub publisher 读取 GH_TOKEN / GITHUB_TOKEN。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 重新运行一个已发布超过 2 小时的 tag 时，electron-publish 默认会认为
          # "existing release published more than 2 hours ago" 而**静默跳过上传**
          # （只打 warn，构建仍然成功）。打开此开关让重跑真正覆盖上传。
          EP_GH_IGNORE_TIME: "true"
          # ⚠️ 必须显式指向官方源。scripts/bundle.mjs:114-117 的默认值是 npmmirror
          # （国内 CDN，为本地开发优化）：ELECTRON_MIRROR → npmmirror.com/mirrors/electron/，
          # electron-builder-binaries → registry.npmmirror.com。
          # GitHub runner 在境外访问国内 CDN 可能很慢甚至失败，所以这里覆盖为官方地址。
          # 本地构建不受影响（本地仍走国内源更快）。
          ELECTRON_MIRROR: "https://github.com/electron/electron/releases/download/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://github.com/electron-userland/electron-builder-binaries/releases/download/"
        run: pnpm bundle:desktop --os ${{ matrix.platform }} --arch ${{ matrix.arch }}
      # .blockmap 必须一起留存，否则 electron-updater 的差分下载会退化为全量包。
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zcode-ce-${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.yml
            packages/desktop/dist/*.blockmap

  # 单独一个 job 设置 Release 描述，必须在两个平台都构建完之后。
  #
  # 为什么需要它：electron-builder 创建 Release 时**不传 body**（electron-publish 里
  # 没有 releaseNotes 的处理），GitHub 会用 tag 的 annotation 作为兜底。而 tag
  # annotation 是纯文本、不是 Markdown，渲染出来是一整块引用样式 —— 字体小、颜色淡、
  # 没有结构。这里显式写入 release-notes.md，得到正常的 Markdown 渲染。
  #
  # 为什么不能放在 build job 里：矩阵是串行的（max-parallel: 1，避免并发创建
  # Release），先完成的平台执行时另一个平台的产物还没上传，描述会写到一半状态。
  release-notes:
    name: set release description
    needs: build
    # 只有 tag 构建才需要（workflow_dispatch 不创建 Release）。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 用 gh 而不是第三方 action：GH_TOKEN 已在仓库内可用，少一个供应链依赖。
      # --notes-file 读取仓库根的双语 release-notes.md（中文在前，英文在后）。
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md \
            --title "ZCode-CE ${{ github.ref_name }}"

  # 远程运行时资产（SSH / WSL / Docker 远程工作区的部署载荷）。
  #
  # 为什么单独一个 job：这份资产**不随安装包分发**（见 docs/development/remote-workspace.md），
  # 需要独立产出与托管；把它挂在 build job 里会让打包矩阵多背一段与本平台无关的构建。
  #
  # 为什么 needs 只写 verify 不写 build：资产链与安装包链互不依赖，并行跑能让
  # 「资产能不能产出」更早暴露（build 要 20 分钟，这条约 5 分钟）。
  # 本 job 上传的是 workflow artifact（可直接拿去静态托管），**不向任何外部主机发布**，
  # 因此不需要额外 secrets、也不会在 PR 上运行（本 workflow 只由 tag / 手动触发）。
  remote-assets:
    name: prepare remote runtime assets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare remote assets
        env:
          # 脚本默认走 cdn.npmmirror.com（国内开发最优）。GitHub 托管 runner 在境外，
          # 显式改用 Node 官方发行源更稳；需要时可用 ZCODE_NODE_DIST_MIRROR 覆盖回镜像。
          ZCODE_NODE_DIST_MIRROR: https://nodejs.org/dist
        run: pnpm prepare:remote-assets

      # 装配成「客户端真正会请求」的布局（<root>/<版本>/manifest-*.json + <root>/components/...），
      # 并自检：manifest.appVersion 一致、每个 artifactPath 可取、每个制品 sha256 与 manifest 相同。
      - name: Assemble publishable layout
        run: node scripts/assemble-remote-assets.mjs

      # 端到端自检：本地起静态服务当"CDN"，用真实 connectRemote 走一遍
      # 拉 manifest → 下载组件 + sha256 → 上传"远端" → 起 zcode-server → 握手。
      - name: End-to-end verify assembled assets
        run: pnpm exec tsx scripts/verify-remote-assets.mjs

      - name: Upload publishable assets
        uses: actions/upload-artifact@v6
        with:
          name: remote-assets
          # 只上传装配后的发布根（manifest + components），mock-cdn 的中间产物不上传。
          path: .tmp/remote-assets-publish/**
          if-no-files-found: error
          retention-days: 30
