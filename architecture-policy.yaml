version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    # 校准（事实错误）：此处原声明 `packages/services/src/session/contract.ts`，但**该文件从未存在**
    # —— 读者会以为有一条可路由的契约面，实际找不到（有人据此尝试接线时踩到）。
    # 另外注意这条清单的作用域：`resolveImport` 只解析**相对** specifier
    # （scripts/architecture/policy.mjs:152-153），因此它只约束「相对路径跨模块导入」；
    # 包级出口（`@zcode/services` 的子路径）走 packages/services/package.json 的 exports，
    # 不经过这条清单。此处改为声明真实存在的入口文件。
    publicEntrypoints: [workspaceRegistryRepo.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
